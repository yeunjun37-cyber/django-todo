<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Todo List{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, "Malgun Gothic", sans-serif; background: #f4f5f7; margin: 0; color: #222; }
        .container { max-width: 720px; margin: 40px auto; padding: 0 16px; }
        h1 { margin-bottom: 8px; }
        a { color: #2563eb; text-decoration: none; }
        .btn { display: inline-block; padding: 6px 12px; border: 0; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-secondary { background: #e5e7eb; color: #222; }
        .btn-danger { background: #ef4444; color: #fff; }
        .messages { list-style: none; padding: 0; }
        .messages li { background: #dcfce7; border: 1px solid #86efac; padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; }
    </style>
    {% block extra_style %}{% endblock %}
</head>
<body>
<div class="container">
    {% if messages %}
    <ul class="messages">
        {% for message in messages %}<li>{{ message }}</li>{% endfor %}
    </ul>
    {% endif %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
